# Render Blueprint: one free web service built from the Dockerfile.
# Render → New → Blueprint → pick this repository. It asks for the passwords; the secret key is generated.
services:
  - type: web
    name: edumatch
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: EDUMATCH_SECRET_KEY
        generateValue: true
      # The sign-in form takes an email address, so usernames are emails. Passwords are set in the dashboard.
      - key: EDUMATCH_ADMIN_USERNAME
        value: superadmin@edumatch.rw
      - key: EDUMATCH_ADMIN_PASSWORD
        sync: false
      - key: EDUMATCH_PLACEMENT_ADMIN_USERNAME
        value: placement@edumatch.rw
      - key: EDUMATCH_PLACEMENT_ADMIN_PASSWORD
        sync: false
      - key: EDUMATCH_OFFICER_USERNAME
        value: officer@edumatch.rw
      - key: EDUMATCH_OFFICER_PASSWORD
        sync: false
      - key: EDUMATCH_SCHOOL_ADMIN_USERNAME
        value: school@edumatch.rw
      - key: EDUMATCH_SCHOOL_ADMIN_PASSWORD
        sync: false
