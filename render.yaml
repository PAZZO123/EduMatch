# Render Blueprint: one free web service built from the Dockerfile.
# Render → New → Blueprint → pick this repository. It asks for the two passwords; the secret key is generated.
services:
  - type: web
    name: edumatch
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: EDUMATCH_SECRET_KEY
        generateValue: true
      - key: EDUMATCH_ADMIN_PASSWORD
        sync: false
      - key: EDUMATCH_OFFICER_PASSWORD
        sync: false
